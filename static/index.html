<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FDF6F0">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <title>My Brain</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Login screen -->
  <div class="screen login-screen" id="login-screen">
    <div class="login-logo">🧠</div>
    <div class="login-title">My Brain</div>
    <div class="login-subtitle">Enter your PIN to continue</div>
    <input type="password" class="pin-input" maxlength="20" inputmode="numeric" autocomplete="off">
    <button class="login-btn">Open</button>
  </div>

  <!-- Main app screen -->
  <div class="screen app-screen" id="app-screen">
    <div class="app-header">
      <h1><span class="greeting">Good morning</span> 🧠</h1>
      <div class="header-right">
        <span class="pending-badge">0 pending</span>
        <button class="deploy-btn" title="Deploy" onclick="triggerDeploy()">🚀</button>
      </div>
    </div>

    <div class="content">
      <div class="loading">Loading</div>
    </div>

    <!-- Bottom tab bar -->
    <nav class="tab-bar">
      <button class="tab active" data-tab="today" onclick="switchTab('today')">
        <span class="tab-icon">🎯</span>
        <span class="tab-label">Today</span>
      </button>
      <button class="tab" data-tab="track" onclick="switchTab('track')">
        <span class="tab-icon">📊</span>
        <span class="tab-label">Track</span>
      </button>
      <button class="tab" data-tab="lists" onclick="switchTab('lists')">
        <span class="tab-icon">📋</span>
        <span class="tab-label">Lists</span>
      </button>
    </nav>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
